[project]
name = "craftly"
version = "0.1.0"
description = "Artisan product cataloguing pipeline — service layer and Listing schema contract"
authors = [
    { name = "sahiti3636", email = "p.sahiti.2006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.0",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "gtts>=2.5.4",
    "rembg>=2.0.84",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
