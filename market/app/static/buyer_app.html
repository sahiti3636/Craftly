<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Craftly — buyer app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
  /* Same design tokens as the artisan app (A1) so the two read as one
     product: khadi ground, clay + indigo, Fraunces over IBM Plex Sans. */
  :root{
    --paper:#F1ECE1; --paper-2:#E9E2D4; --card:#FBF8F2; --ink:#2A2420; --ink-2:#4D443D;
    --muted:#71655A; --line:#DDD2C4; --accent:#B8542E; --accent-soft:#f7ece4; --clay-deep:#7A3820;
    --indigo:#2B4159; --green:#4F6E4A; --green-soft:#CFDFC6; --amber:#B47B1A;
    --amber-soft:#F3DFB2; --red:#A23B36; --red-soft:#EFC9C6;
    --serif:'Fraunces',Georgia,serif;
    --sans:'IBM Plex Sans','Noto Sans Devanagari',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    --shadow:0 18px 40px -20px rgba(42,36,32,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overscroll-behavior:none;}
  body{background:#e4ddcf;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
    display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  button,.card,.chip,.tile{-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}
  [hidden]{display:none!important;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* App shell: full-viewport on a phone; a centred phone-width column on a
     desktop browser. No bezel or notch. */
  .app{width:100%;max-width:480px;height:100%;background:var(--paper);position:relative;overflow:hidden;}
  @media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(30,27,22,.4);}}
  .screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;}
  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);}
  .view::-webkit-scrollbar{display:none;}
  @media (prefers-reduced-motion:no-preference){.view>*{animation:enter .18s ease-out;}}
  @keyframes enter{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .header{display:flex;align-items:center;margin-bottom:18px;gap:10px;}
  .header h1{flex:1;text-align:center;font-size:19px;margin:0;font-weight:600;}
  .back{width:34px;height:34px;border-radius:50%;flex:none;background:var(--card);border:1px solid var(--line);
    font-size:20px;line-height:1;color:var(--ink);padding:0 0 3px;}
  .spacer34{width:34px;flex:none;}
  .brand{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--clay-deep);margin:2px 0 22px;}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px;}
  .lang button{border:none;background:var(--card);padding:4px 11px;font-size:12px;color:var(--ink);}
  .lang button.on{background:var(--ink);color:var(--card);}
  .tile{border-radius:22px;padding:32px 18px;margin-bottom:16px;text-align:center;cursor:pointer;color:#FBF8F2;border:none;width:100%;}
  .tile .icon{font-size:34px;display:block;margin-bottom:8px;}
  .tile .label{font-size:19px;font-weight:700;font-family:var(--sans);}
  .tile.a{background:var(--accent);}
  .tile.b{background:var(--indigo);}
  .rowcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font-size:14px;font-weight:600;color:var(--ink);}
  .rowcard .chev{font-size:20px;color:var(--muted);font-weight:400;}

  .search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);
    font:inherit;color:var(--ink);margin-bottom:10px;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--ink-2);}
  .chip.on{background:var(--accent);color:#FBF8F2;border-color:var(--accent);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;text-align:left;
    padding:0;display:flex;flex-direction:column;color:inherit;}
  .card .thumb{aspect-ratio:1/1;background:var(--paper-2);}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1;}
  .card .t{font-family:var(--serif);font-size:14px;line-height:1.25;}
  .card .pl{font-size:11.5px;color:var(--muted);}
  .card .pr{margin-top:auto;padding-top:5px;font-weight:700;font-variant-numeric:tabular-nums;}
  .card .sh{font-size:11px;color:var(--green);font-weight:600;}

  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;}
  .pill.blocked{background:var(--red-soft);color:var(--red);}
  .pill.low{background:var(--amber-soft);color:var(--amber);}
  .pill.ok{background:var(--green-soft);color:var(--green);}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:13px;
    border:1.5px solid var(--accent);background:var(--accent);color:#FBF8F2;font-weight:700;font-size:15.5px;}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:9px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .hero{border-radius:14px;overflow:hidden;background:var(--paper-2);aspect-ratio:1/1;margin-bottom:12px;}
  .hero img{width:100%;height:100%;object-fit:cover;}
  .price{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
  .share{color:var(--green);font-weight:600;font-size:13px;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0;}
  .box h3{font-size:14px;margin-bottom:6px;}
  .box ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);}
  .box li{margin-bottom:3px;}
  .muted{color:var(--muted);font-size:13px;}
  .note{background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0;}
  .note.err{background:var(--red-soft);border-color:#e9bcb6;}
  .note.ok{background:var(--green-soft);border-color:#c2dcc4;}

  .line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .line img{width:54px;height:54px;border-radius:9px;object-fit:cover;flex:none;background:var(--paper-2);}
  .line .m{flex:1;min-width:0;}
  .line .m b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;}
  .qty{display:flex;align-items:center;gap:8px;}
  .qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px;}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:14px 0;}

  label.f{display:block;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--muted);}
  label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;font:inherit;font-size:15px;color:var(--ink);background:var(--card);}
  .steps{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid var(--line);}
  .steps li{padding:0 0 12px 14px;position:relative;font-size:13px;}
  .steps li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .steps b{display:block;}
  .empty{text-align:center;color:var(--muted);margin-top:50px;}
  .toast{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--ink);color:var(--paper);padding:11px 14px;
    border-radius:11px;font-size:13px;text-align:center;opacity:0;transform:translateY(8px);
    transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;transform:none;}
  .stub{font-size:11px;text-align:center;color:var(--muted);margin-top:14px;}
</style>
</head>
<body>
<div class="app"><div class="screen">
  <div class="view" id="view"></div>
  <div class="toast" id="toast"></div>
</div></div>

<script>
(function(){
  "use strict";

  var STORE = "craftly_buyer_app_v1";
  var products = [];            // /api/products result
  var loadError = null;
  var state = load();           // { lang, basket: {listing_id: qty} }
  var route = {name:"home", params:{}};
  var history = [];
  var filters = {q:"", category:""};
  var sampleCode = null;

  function load(){
    try{ var raw = localStorage.getItem(STORE); if (raw){ var s = JSON.parse(raw);
      return {lang:s.lang === "hi" ? "hi" : "en", basket:s.basket || {}}; } }catch(e){}
    return {lang:"en", basket:{}};
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

  var T = {
    en:{shop:"Shop",bulk:"Bulk order",bulkOrders:"Bulk Orders",scan:"Verify",basket:"Basket",search:"Search a craft, material, village…",all:"All",
      addBasket:"Add to basket",inBasket:"In basket",toMaker:"to the maker",howPriced:"How this price is built",
      about:"About this piece",checkout:"Check out",placeOrder:"Place order",empty:"Your basket is empty.",
      total:"Total",name:"Your name",phone:"Phone",address:"Address",city:"City",state:"State",pincode:"Pincode",
      orderPlaced:"Order placed",orderThanks:"The maker's share reaches her when it is delivered.",
      continueShopping:"Keep shopping",quote:"Get quote",qty:"Quantity",deadline:"Needed by",piece:"Piece",
      verifyTitle:"Verify a craft passport",code:"Passport code",check:"Check",trySample:"Try a sample code",
      madeBy:"Made by",hours:"Hours of work",materials:"Materials cost",chain:"How it came to exist",
      noResults:"Nothing matches that.",unavailable:"Could not reach the shop service."},
    hi:{shop:"दुकान",bulk:"थोक ऑर्डर",bulkOrders:"थोक ऑर्डर",scan:"जाँचें",basket:"टोकरी",search:"शिल्प, सामग्री या गाँव खोजें…",all:"सभी",
      addBasket:"टोकरी में जोड़ें",inBasket:"टोकरी में है",toMaker:"कारीगर को",howPriced:"यह कीमत कैसे बनी",
      about:"इस कृति के बारे में",checkout:"चेकआउट",placeOrder:"ऑर्डर करें",empty:"आपकी टोकरी खाली है।",
      total:"कुल",name:"आपका नाम",phone:"फ़ोन",address:"पता",city:"शहर",state:"राज्य",pincode:"पिनकोड",
      orderPlaced:"ऑर्डर हो गया",orderThanks:"डिलीवरी पर कारीगर को उसका हिस्सा मिलेगा।",
      continueShopping:"खरीदारी जारी रखें",quote:"कोटेशन लें",qty:"मात्रा",deadline:"कब तक चाहिए",piece:"वस्तु",
      verifyTitle:"क्राफ्ट पासपोर्ट जाँचें",code:"पासपोर्ट कोड",check:"जाँचें",trySample:"नमूना कोड आज़माएँ",
      madeBy:"बनाने वाले",hours:"काम के घंटे",materials:"सामग्री की लागत",chain:"यह कैसे बना",
      noResults:"कुछ नहीं मिला।",unavailable:"दुकान की सेवा से संपर्क नहीं हो सका।"}
  };
  function t(k){ return (T[state.lang] && T[state.lang][k]) || T.en[k] || k; }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  // Indian digit grouping (12,34,567), same as the site's money.py.
  function rupees(n){
    if (n == null) return "—";
    var s = String(Math.round(n)), last3 = s.slice(-3), rest = s.slice(0, -3);
    if (rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + ",";
    return "₹" + rest + last3;
  }
  function title(p){ var l = p.listing; return (state.lang === "hi" && l.title_hi) || l.title_en || l.title_hi || "Handmade piece"; }
  function desc(p){ var l = p.listing; return (state.lang === "hi" && l.description_hi) || l.description_en || l.description_hi || ""; }
  function byId(id){ return products.find(function(p){ return p.listing.listing_id === id; }); }
  function basketCount(){ return Object.keys(state.basket).reduce(function(n,k){ return n + state.basket[k]; }, 0); }

  var toastTimer = null;
  function toast(msg){ var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600); }

  function go(name, params){ history.push(route); route = {name:name, params:params || {}}; render(); }
  function goTab(name){ history = []; route = {name:name, params:{}}; render(); }
  function back(){ if (history.length){ route = history.pop(); render(); } else goTab("home"); }

  function api(path){
    return fetch(path).then(function(r){
      return r.json().then(function(d){ if (!r.ok) throw new Error(d.detail || ("Request failed (" + r.status + ")")); return d; });
    });
  }

  /* ---------- chrome ---------- */
  function langSwitch(){
    return '<div class="lang"><button data-lang="en" class="' + (state.lang === "en" ? "on" : "") + '">EN</button>' +
      '<button data-lang="hi" class="' + (state.lang === "hi" ? "on" : "") + '">HI</button></div>';
  }
  function header(text, withBack){
    if (!text) return '<div class="row between"><div class="brand">Craftly</div>' + langSwitch() + '</div>';
    return '<div class="header">' + (withBack ? '<button class="back" id="backBtn" aria-label="Back">‹</button>' : '<div class="spacer34"></div>') +
      '<h1>' + esc(text) + '</h1><div class="spacer34"></div></div>';
  }

  function render(){
    var view = document.getElementById("view");
    var fn = SCREENS[route.name];
    try{
      view.innerHTML = fn(route.params);
      view.scrollTop = 0;
      var lang = view.querySelectorAll("[data-lang]");
      Array.prototype.forEach.call(lang, function(b){ b.onclick = function(){ state.lang = b.getAttribute("data-lang"); save(); render(); }; });
      var bb = document.getElementById("backBtn"); if (bb) bb.onclick = back;
      BIND[route.name] && BIND[route.name](route.params);
    }catch(err){
      view.innerHTML = '<p class="empty">Something went wrong.<br><small>' + esc(err.message) + '</small></p>';
      if (window.console) console.error(err);
    }
  }

  var SCREENS = {}, BIND = {};

  /* ---------- home ---------- */
  SCREENS.home = function(){
    var n = basketCount();
    return header() +
      '<button class="tile a" data-go="shop"><span class="icon">🛍</span><span class="label">' + t("shop") + '</span></button>' +
      '<button class="tile b" data-go="bulk"><span class="icon">📦</span><span class="label">' + t("bulkOrders") + '</span></button>' +
      '<button class="rowcard" data-go="scan"><span>🔍 ' + t("verifyTitle") + '</span><span class="chev">›</span></button>' +
      '<button class="rowcard" data-go="basket"><span>🧺 ' + t("basket") + (n ? ' · ' + n : '') + '</span><span class="chev">›</span></button>';
  };
  BIND.home = function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(b){
      b.onclick = function(){ go(b.getAttribute("data-go")); };
    });
  };

  /* ---------- shop ---------- */
  function categories(){
    var seen = {}; products.forEach(function(p){ if (p.listing.category) seen[p.listing.category] = true; });
    return Object.keys(seen).sort();
  }
  function visible(){
    var q = filters.q.trim().toLowerCase();
    return products.filter(function(p){
      if (filters.category && p.listing.category !== filters.category) return false;
      if (!q) return true;
      var l = p.listing;
      return [l.title_en, l.title_hi, l.category, l.craft_type, l.material, (l.colours || []).join(" "), p.artisan_name, p.place]
        .join(" ").toLowerCase().indexOf(q) !== -1;
    });
  }
  SCREENS.shop = function(){
    if (loadError) return header(t("shop"), true) + '<div class="note err">' + esc(t("unavailable")) + '<br><small>' + esc(loadError) + '</small></div>';
    var chips = '<button class="chip' + (!filters.category ? " on" : "") + '" data-cat="">' + t("all") + '</button>' +
      categories().map(function(c){ return '<button class="chip' + (filters.category === c ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join("");
    return header(t("shop"), true) +
      '<input class="search" id="q" type="search" placeholder="' + esc(t("search")) + '" value="' + esc(filters.q) + '">' +
      '<div class="chips">' + chips + '</div><div class="grid" id="grid">' + gridHtml() + '</div>' +
      '<div class="stub">Served by the market service · same catalogue as the website</div>';
  };
  function gridHtml(){
    var list = visible();
    if (!list.length) return '<p class="empty" style="grid-column:1/-1">' + t("noResults") + '</p>';
    return list.map(function(p){
      var flag = !p.can_buy ? '<span class="pill blocked">' + esc(p.blocked_reason || "Not for sale yet") + '</span>' :
        (p.inventory.in_stock > 0 && p.inventory.in_stock <= 20 ? '<span class="pill low">Only ' + p.inventory.in_stock + ' left</span>' : "");
      return '<button class="card" data-open="' + esc(p.listing.listing_id) + '">' +
        '<div class="thumb">' + (p.image_url ? '<img loading="lazy" src="' + esc(p.image_url) + '" alt="">' : "") + '</div>' +
        '<div class="body"><div class="t">' + esc(title(p)) + '</div>' +
        '<div class="pl">' + esc(p.artisan_name) + (p.place ? " · " + esc(p.place) : "") + '</div>' + flag +
        '<div class="pr">' + rupees(p.price.price_inr) + '</div>' +
        '<div class="sh">' + p.artisan_share_pct + '% ' + t("toMaker") + '</div></div></button>';
    }).join("");
  }
  function bindGrid(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){
      b.onclick = function(){ go("product", {id:b.getAttribute("data-open")}); };
    });
  }
  BIND.shop = function(){
    var q = document.getElementById("q");
    if (q) q.oninput = function(){ filters.q = q.value; document.getElementById("grid").innerHTML = gridHtml(); bindGrid(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function(b){
      b.onclick = function(){ filters.category = b.getAttribute("data-cat"); render(); };
    });
    bindGrid();
  };

  /* ---------- product ---------- */
  SCREENS.product = function(params){
    var p = byId(params.id);
    if (!p) return header(t("shop"), true) + '<p class="empty">This piece is no longer listed.</p>';
    var l = p.listing, inB = state.basket[l.listing_id] || 0;
    var meta = [l.craft_type, l.material, (l.colours || []).join(", "), l.dimensions].filter(Boolean).map(esc).join(" · ");
    var blocked = !p.can_buy ? '<div class="note err"><b>' + esc(p.blocked_reason || "Not for sale yet") + '</b></div>' : "";
    var stock = p.inventory.in_stock > 0 ? '<span class="pill ok">' + p.inventory.in_stock + ' in stock</span>' :
      (p.inventory.made_to_order ? '<span class="pill low">Made to order' + (p.inventory.lead_time_days ? " · " + p.inventory.lead_time_days + " days" : "") + '</span>' : "");
    var why = (p.price.explanation || []).map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("");
    return header(t("shop"), true) +
      '<div class="hero">' + (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="">' : "") + '</div>' +
      '<h1 style="font-size:23px;margin-bottom:4px">' + esc(title(p)) + '</h1>' +
      '<div class="muted">' + esc(p.artisan_name) + (p.place ? " · " + esc(p.place) : "") + '</div>' +
      '<div style="margin:10px 0 2px"><span class="price">' + rupees(p.price.price_inr) + '</span></div>' +
      '<div class="share">' + p.artisan_share_pct + '% ' + t("toMaker") + ' · ' + rupees(p.price.artisan_take_home_inr) + '</div>' +
      '<div style="margin:8px 0">' + stock + '</div>' + blocked +
      (why ? '<div class="box"><h3>' + t("howPriced") + '</h3><ul>' + why + '</ul></div>' : "") +
      (meta || desc(p) ? '<div class="box"><h3>' + t("about") + '</h3>' + (meta ? '<div class="muted" style="margin-bottom:6px">' + meta + '</div>' : "") +
        '<div style="font-size:14px">' + esc(desc(p)) + '</div></div>' : "") +
      '<button class="btn accent" id="addBtn"' + (p.can_buy ? "" : " disabled") + '>' + (inB ? t("inBasket") + " (" + inB + ") · +1" : t("addBasket")) + '</button>';
  };
  BIND.product = function(params){
    var b = document.getElementById("addBtn");
    if (b) b.onclick = function(){ state.basket[params.id] = (state.basket[params.id] || 0) + 1; save(); toast("Added to basket"); render(); };
  };

  /* ---------- basket + checkout ---------- */
  function lines(){
    return Object.keys(state.basket).map(function(id){ return {p:byId(id), qty:state.basket[id]}; })
      .filter(function(x){ return x.p; });
  }
  function totalInr(){ return lines().reduce(function(n,x){ return n + x.p.price.price_inr * x.qty; }, 0); }
  SCREENS.basket = function(){
    var ls = lines();
    if (!ls.length) return header(t("basket"), true) + '<p class="empty">' + t("empty") + '</p>';
    return header(t("basket"), true) + ls.map(function(x){
      return '<div class="line"><img src="' + esc(x.p.image_url || "") + '" alt=""><div class="m"><b>' + esc(title(x.p)) + '</b>' +
        '<span class="muted">' + rupees(x.p.price.price_inr) + '</span></div>' +
        '<div class="qty"><button data-dec="' + esc(x.p.listing.listing_id) + '">−</button><b>' + x.qty + '</b>' +
        '<button data-inc="' + esc(x.p.listing.listing_id) + '">+</button></div></div>';
    }).join("") + '<div class="total"><span>' + t("total") + '</span><span>' + rupees(totalInr()) + '</span></div>' +
      '<button class="btn accent" id="toCheckout">' + t("checkout") + '</button>';
  };
  BIND.basket = function(){
    function bump(id, d){ var n = (state.basket[id] || 0) + d; if (n <= 0) delete state.basket[id]; else state.basket[id] = n; save(); render(); }
    Array.prototype.forEach.call(document.querySelectorAll("[data-inc]"), function(b){ b.onclick = function(){ bump(b.getAttribute("data-inc"), 1); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-dec]"), function(b){ b.onclick = function(){ bump(b.getAttribute("data-dec"), -1); }; });
    var c = document.getElementById("toCheckout"); if (c) c.onclick = function(){ go("checkout"); };
  };

  SCREENS.checkout = function(){
    return header(t("checkout"), true) +
      '<div class="total" style="margin-top:0"><span>' + t("total") + '</span><span>' + rupees(totalInr()) + '</span></div>' +
      '<form id="coForm">' +
      [["name",t("name"),"text",true],["phone",t("phone"),"tel",true],["address",t("address"),"text",false],
       ["city",t("city"),"text",false],["state",t("state"),"text",false],["pincode",t("pincode"),"text",false]].map(function(f){
        return '<label class="f">' + f[1] + '<input name="' + f[0] + '" type="' + f[2] + '"' + (f[3] ? " required" : "") + '></label>';
      }).join("") + '<div id="coErr"></div><button class="btn accent" id="placeBtn" type="submit">' + t("placeOrder") + '</button></form>';
  };
  function post(path, fields){
    return fetch(path, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams(fields).toString(), credentials:"same-origin"});
  }
  BIND.checkout = function(){
    var form = document.getElementById("coForm");
    form.onsubmit = function(e){
      e.preventDefault();
      var btn = document.getElementById("placeBtn"), err = document.getElementById("coErr");
      btn.disabled = true; err.innerHTML = "";
      var ls = lines(), fd = new FormData(form), fields = {};
      fd.forEach(function(v,k){ fields[k] = v; });
      // The site's basket is a signed cookie, so mirror this basket into it
      // (zero any leftovers first), then place the order through the same
      // /checkout the website uses — no separate order path to keep in sync.
      var seq = Promise.resolve();
      ls.forEach(function(x){ seq = seq.then(function(){ return post("/cart/update", {listing_id:x.p.listing.listing_id, quantity:0}); }); });
      ls.forEach(function(x){ seq = seq.then(function(){ return post("/cart/add", {listing_id:x.p.listing.listing_id, quantity:x.qty, then:"/cart"}); }); });
      seq.then(function(){ return post("/checkout", fields); }).then(function(r){
        var m = /\/order\/([^/?#]+)/.exec(r.url);
        if (!r.ok || !m) throw new Error("The shop could not place this order — an item may no longer be for sale.");
        state.basket = {}; save();
        history = []; route = {name:"placed", params:{id:decodeURIComponent(m[1])}}; render();
      }).catch(function(e2){ btn.disabled = false; err.innerHTML = '<div class="note err">' + esc(e2.message) + '</div>'; });
    };
  };
  SCREENS.placed = function(params){
    return header("") + '<div class="note ok" style="margin-top:20px"><b>' + t("orderPlaced") + '</b><br>' + esc(params.id) + '<br><span class="muted">' +
      t("orderThanks") + '</span></div><button class="btn ghost" id="moreBtn">' + t("continueShopping") + '</button>';
  };
  BIND.placed = function(){ document.getElementById("moreBtn").onclick = function(){ goTab("home"); }; };

  /* ---------- bulk ---------- */
  SCREENS.bulk = function(){
    var opts = products.filter(function(p){ return p.can_buy; }).map(function(p){
      return '<option value="' + esc(p.listing.listing_id) + '">' + esc(title(p)) + '</option>'; }).join("");
    return header(t("bulk"), true) + '<p class="muted" style="margin-top:0">Bulk orders are split across the maker\'s cluster. Discounts come out of the margin, never the wage floor.</p>' +
      '<form id="bulkForm"><label class="f">' + t("piece") + '<select name="listing_id">' + opts + '</select></label>' +
      '<label class="f">' + t("qty") + '<input name="quantity" type="number" min="1" value="100" required></label>' +
      '<label class="f">' + t("deadline") + '<input name="deadline" type="date"></label>' +
      '<button class="btn accent" type="submit">' + t("quote") + '</button></form><div id="bulkOut"></div>';
  };
  BIND.bulk = function(){
    var form = document.getElementById("bulkForm"), out = document.getElementById("bulkOut");
    form.onsubmit = function(e){
      e.preventDefault(); out.innerHTML = '<p class="muted">Quoting…</p>';
      var q = new URLSearchParams(); new FormData(form).forEach(function(v,k){ if (v) q.set(k, v); });
      api("/api/bulk/quote?" + q.toString()).then(function(d){
        var h = "";
        if (d.errors && d.errors.length) h += '<div class="note err">' + d.errors.map(esc).join("<br>") + '</div>';
        if (!d.can_order){
          if (d.max_by_deadline != null) h += '<div class="note">They can commit <b>' + d.max_by_deadline + '</b> units by that date.</div>';
          if (d.days_needed != null) h += '<div class="note">All ' + d.quantity + ' would need about <b>' + d.days_needed + ' days</b>.</div>';
        } else {
          h += '<div class="box"><h3>' + rupees(d.unit_price_inr) + ' each</h3><div class="muted">Retail ' + rupees(d.retail_unit_price_inr) +
            ' · subtotal <b>' + rupees(d.subtotal_inr) + '</b><br>To the makers: ' + rupees(d.artisan_total_inr) + '</div></div>';
        }
        var al = (d.split && d.split.allocations) || [];
        if (al.length) h += '<div class="box"><h3>Split across the cluster</h3><ul>' + al.map(function(a){
          return "<li>" + esc(a.artisan_name) + (a.village ? " (" + esc(a.village) + ")" : "") + " — " + a.quantity + " units" +
            (a.lead_time_days ? ", " + a.lead_time_days + " days" : "") + "</li>"; }).join("") + '</ul></div>';
        (d.warnings || []).forEach(function(w){ h += '<div class="note">' + esc(w) + '</div>'; });
        out.innerHTML = h;
      }).catch(function(e2){ out.innerHTML = '<div class="note err">' + esc(e2.message) + '</div>'; });
    };
  };

  /* ---------- verify passport ---------- */
  SCREENS.scan = function(){
    return header(t("verifyTitle"), true) + '<form id="scanForm"><label class="f">' + t("code") +
      '<input name="code" placeholder="CR-XXXX-XXXX" autocapitalize="characters" required></label>' +
      '<button class="btn accent" type="submit">' + t("check") + '</button></form>' +
      (sampleCode ? '<button class="btn ghost small" id="sampleBtn" style="margin-top:10px">' + t("trySample") + '</button>' : "") +
      '<div id="scanOut"></div>';
  };
  BIND.scan = function(){
    var form = document.getElementById("scanForm"), out = document.getElementById("scanOut");
    function run(code){
      out.innerHTML = '<p class="muted">Checking…</p>';
      api("/api/passports/" + encodeURIComponent(code.trim())).then(function(d){
        var a = d.artisan || {};
        out.innerHTML = '<div class="note ok"><b>✓ Verified</b> · ' + esc(d.verification_code) + '</div>' +
          '<div class="box"><h3>' + t("madeBy") + " " + esc(a.name || "") + '</h3><div class="muted">' +
          esc([d.made_at || a.village, a.district, a.state].filter(Boolean).join(", ")) + '</div>' +
          '<div style="margin-top:8px;font-size:14px">' + esc([d.craft_type, d.material].filter(Boolean).join(" · ")) + '</div>' +
          (d.hours_worked != null ? '<div class="muted">' + t("hours") + ": " + d.hours_worked + '</div>' : "") +
          (d.material_cost_inr != null ? '<div class="muted">' + t("materials") + ": " + rupees(d.material_cost_inr) + '</div>' : "") + '</div>' +
          ((d.chain || []).length ? '<div class="box"><h3>' + t("chain") + '</h3><ol class="steps">' +
            d.chain.map(function(s){ return "<li><b>" + esc(s.label) + "</b>" + esc(s.detail || "") + "</li>"; }).join("") + '</ol></div>' : "");
      }).catch(function(){ out.innerHTML = '<div class="note err">We cannot verify this code. Check it and try again.</div>'; });
    }
    form.onsubmit = function(e){ e.preventDefault(); run(new FormData(form).get("code")); };
    var s = document.getElementById("sampleBtn");
    if (s) s.onclick = function(){ form.elements.code.value = sampleCode; run(sampleCode); };
  };

  /* ---------- boot ---------- */
  api("/api/products?per_page=100").then(function(d){ products = d.products; })
    .catch(function(e){ loadError = e.message; })
    .then(function(){
      render();
      var first = products.find(function(p){ return p.passport_code || true; });
      if (first) api("/api/products/" + encodeURIComponent(first.listing.listing_id)).then(function(d){
        if (d.passport_code){ sampleCode = d.passport_code; if (route.name === "scan") render(); } }).catch(function(){});
    });
})();
</script>
</body>
</html>
