<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Craftly — shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
  /* Craftly buyer app — light and cool: white ground, navy for action,
     one small orange accent. The photographs carry all the warmth. */
  :root{
    --paper:#ffffff; --card:#f3f6fb; --ink:#14284b; --ink-2:#34466b; --muted:#6a7893; --line:#e3e9f2;
    --accent:#1f4a8f; --navy:#1f4a8f; --navy-deep:#132c58; --orange:#ee7b30;
    --green:#1c7a4b; --green-soft:#e1f4ea; --amber:#946000; --amber-soft:#fff2d3; --red:#b8362c; --red-soft:#fde8e5;
    --serif:'Fraunces','Noto Sans Devanagari',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Devanagari','Noto Sans',Roboto,Arial,sans-serif;
    --shadow:0 10px 28px rgba(20,40,75,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overscroll-behavior:none;}
  body{background:#e9eef6;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
    display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;font-weight:600;line-height:1.2;font-family:var(--serif);}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  button,.card,.coll,.reel,.chip,.tile{-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  [hidden]{display:none!important;}
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .app{width:100%;max-width:480px;height:100%;background:var(--paper);position:relative;overflow:hidden;}
  @media (min-width:520px){.app{box-shadow:0 0 0 1px #d5dded,0 24px 60px -24px rgba(20,40,75,.35);}}
  .screen{position:relative;width:100%;height:100%;}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 104px);}
  .view.home{padding:0 0 calc(env(safe-area-inset-bottom,0px) + 28px);}
  .view::-webkit-scrollbar{display:none;}
  @media (prefers-reduced-motion:no-preference){.view>*{animation:enter .22s ease-out;}}
  @keyframes enter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .pad{padding:0 20px;}

  /* ---- top bar ---- */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;}
  .wm{display:flex;align-items:flex-start;gap:2px;font-family:var(--serif);font-weight:600;font-size:36px;line-height:1;color:var(--navy-deep);letter-spacing:-.01em;}
  .wm svg{width:20px;height:24px;margin-top:2px;}
  .ico{display:flex;gap:6px;align-items:center;}
  .ib{position:relative;width:38px;height:38px;border:none;background:none;color:var(--navy-deep);display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .ib svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ib .count{position:absolute;top:1px;right:0;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:16px;text-align:center;line-height:16px;}
  .ib.lang{font-weight:700;font-size:15px;border:1.5px solid var(--line);width:34px;height:34px;}

  /* ---- hero ---- */
  .hero{position:relative;height:330px;background:#1b2a44 url(/static/hero.jpg) 62% center/cover no-repeat;}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,24,48,.78) 0%,rgba(12,24,48,.42) 48%,rgba(12,24,48,0) 80%);}
  .hero .txt{position:absolute;left:22px;top:50%;transform:translateY(-52%);color:#fff;max-width:62%;}
  .hero h2{font-size:38px;font-weight:500;line-height:1.08;}
  .hero h2 em{font-style:italic;display:block;}
  .hero .rule{width:46px;height:3px;background:var(--orange);margin:16px 0 14px;border-radius:2px;}
  .hero .caps{font-size:12px;letter-spacing:.22em;font-weight:600;line-height:1.75;opacity:.95;}
  /* Hindi screens carry an English gloss, so the hero line is twice as long;
     and letter-spacing pulls Devanagari conjuncts apart. */
  .lang-hi .hero h2{font-size:27px;}
  .lang-hi .hero .caps,.lang-hi .maker .sub,.lang-hi .fl2{letter-spacing:0;}

  .maker{display:flex;align-items:center;gap:14px;margin:16px 16px 0;padding:10px 16px 10px 10px;background:var(--card);border:1px solid var(--line);
    border-radius:22px;width:calc(100% - 32px);text-align:left;}
  .maker .ph{width:92px;height:92px;border-radius:50%;background:#cfd8e8 url(/static/makers.jpg) center/cover;flex:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(20,40,75,.15);}
  .maker .tx{flex:1;min-width:0;}
  .maker h3{font-size:22px;color:var(--navy-deep);}
  .maker .sub{font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.5;}
  .maker .chev{font-size:26px;color:var(--navy);font-weight:300;}

  .tiles{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 2px;scrollbar-width:none;}
  .tiles::-webkit-scrollbar{display:none;}
  .tile{flex:none;width:calc((100% - 58px)/4);min-width:78px;background:none;border:none;padding:0;text-align:center;}
  .tile .im{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--card);}
  .tile .im img{width:100%;height:100%;object-fit:cover;}
  .tile .lb{margin-top:7px;font-size:13px;color:var(--ink-2);text-transform:capitalize;}

  .cta{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 16px 4px;width:calc(100% - 32px);height:62px;border:none;border-radius:31px;
    background:var(--navy);color:#fff;font-family:var(--serif);font-size:23px;font-weight:500;box-shadow:0 8px 22px rgba(31,74,143,.32);}
  .cta span{font-family:var(--sans);font-size:22px;}
  .quick{display:flex;gap:8px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none;}
  .quick::-webkit-scrollbar{display:none;}
  .quick button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--navy-deep);}

  .sec{display:flex;align-items:baseline;justify-content:space-between;font-size:24px;margin:30px 20px 12px;color:var(--navy-deep);}
  .sec button{border:none;background:none;color:var(--navy);font-size:14px;font-weight:600;font-family:var(--sans);}
  .rail{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;scroll-snap-type:x proximity;}
  .rail::-webkit-scrollbar{display:none;}
  .reel{flex:none;width:158px;height:214px;border-radius:16px;overflow:hidden;position:relative;background:var(--card);display:block;scroll-snap-align:start;border:none;}
  .reel img{width:100%;height:100%;object-fit:cover;}
  .reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(8,16,34,.78) 100%);}
  .reel .cap{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;font-size:13px;font-weight:600;line-height:1.3;color:#fff;}
  .reel .play{position:absolute;top:10px;right:10px;z-index:1;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;font-size:11px;padding-left:2px;}

  /* ---- lists / grid ---- */
  .h1{font-size:30px;margin:2px 0 16px;color:var(--navy-deep);}
  .search{width:100%;padding:12px 18px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);
    font:inherit;color:var(--ink);margin-bottom:12px;}
  .search::placeholder{color:var(--muted);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font-size:13.5px;color:var(--ink-2);text-transform:capitalize;}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:0;}
  .card{background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;color:inherit;}
  .card .thumb{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--card);}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .body{padding:9px 2px 0;display:flex;flex-direction:column;gap:2px;}
  .card .t{font-size:14.5px;font-weight:600;line-height:1.25;color:var(--ink);}
  .card .pl{font-size:12px;color:var(--muted);}
  .card .pr{font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--navy-deep);}
  .card .sh{font-size:12px;color:var(--green);font-weight:600;}

  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;margin-top:3px;align-self:flex-start;}
  .pill.blocked{background:var(--red-soft);color:var(--red);}
  .pill.low{background:var(--amber-soft);color:var(--amber);}
  .pill.ok{background:var(--green-soft);color:var(--green);}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 20px;border-radius:30px;
    border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(31,74,143,.25);}
  .btn.ghost{background:#fff;color:var(--navy);box-shadow:none;}
  .btn.small{width:auto;padding:9px 16px;font-size:14px;border-radius:99px;box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

  .bleed{margin:calc(-1 * (env(safe-area-inset-top,0px) + 20px)) -20px 16px;height:calc(360px + env(safe-area-inset-top,0px));background:var(--card);position:relative;}
  .bleed img{width:100%;height:100%;object-fit:cover;}
  .bleed::after{content:"";position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(180deg,transparent,#fff);}
  .price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy-deep);}
  .share{color:var(--green);font-weight:600;font-size:14px;}
  .box{background:var(--card);border-radius:16px;padding:15px;margin:14px 0;}
  .box h3{font-size:17px;margin-bottom:7px;color:var(--navy-deep);}
  .box ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);}
  .box li{margin-bottom:4px;}
  .muted{color:var(--muted);font-size:13.5px;}
  .note{background:var(--amber-soft);border-radius:14px;padding:11px 14px;font-size:13.5px;margin:12px 0;}
  .note.err{background:var(--red-soft);}
  .note.ok{background:var(--green-soft);}

  .line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .line img{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:none;background:var(--card);}
  .line .m{flex:1;min-width:0;}
  .line .m b{display:block;font-size:14.5px;}
  .qty{display:flex;align-items:center;gap:9px;}
  .qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:16px;color:var(--navy-deep);}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin:16px 0;color:var(--navy-deep);}
  label.f{display:block;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--muted);}
  label.f input,label.f select{display:block;width:100%;margin-top:5px;padding:13px 15px;border:1.5px solid var(--line);
    border-radius:14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;}
  .steps{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid var(--line);}
  .steps li{padding:0 0 13px 15px;position:relative;font-size:13.5px;}
  .steps li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--orange);}
  .steps b{display:block;}
  .empty{text-align:center;color:var(--muted);margin-top:60px;}
  .stub{font-size:11.5px;text-align:center;color:var(--muted);margin:22px 20px 0;}
  .mk{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:12px;text-align:left;}
  .mk img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;}
  .mk b{display:block;font-family:var(--serif);font-size:18px;color:var(--navy-deep);font-weight:600;}
  .mk span{font-size:13px;color:var(--muted);}
  .mk .chev{margin-left:auto;font-size:24px;color:var(--navy);}


  /* ---- filters ---- */
  .ctl{display:flex;gap:10px;margin-bottom:12px;}
  .fbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--navy-deep);}
  .fbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;}
  .fbtn b{background:var(--orange);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;}
  .sortsel{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--navy-deep);}
  .actv{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
  .actv button{border:none;background:#e6eefb;color:var(--navy-deep);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;}
  .count{font-size:13px;color:var(--muted);margin:2px 0 12px;}
  .sheet-back{position:absolute;inset:0;background:rgba(10,20,40,.5);z-index:20;}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;z-index:21;background:#fff;border-radius:26px 26px 0 0;display:flex;flex-direction:column;
    box-shadow:0 -12px 40px rgba(10,20,40,.3);}
  @media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out;}}
  @keyframes up{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
  .sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;}
  .sheet .sh-h h3{font-size:22px;color:var(--navy-deep);}
  .sheet .x{border:none;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--navy-deep);}
  .sheet .sh-b{overflow-y:auto;padding:4px 20px 12px;}
  .fg{margin:14px 0 6px;}
  .fl2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .fchips{display:flex;flex-wrap:wrap;gap:8px;}
  .fchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13.5px;color:var(--ink-2);}
  .fchip i{font-style:normal;color:var(--muted);font-size:12px;margin-left:3px;}
  .fchip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
  .fchip.on i{color:#cfe0fa;}
  .prow{display:flex;gap:10px;align-items:center;}
  .prow input{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;color:var(--ink);}
  .trow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:15px;font-weight:600;color:var(--ink);}
  .sw{position:relative;width:46px;height:28px;border-radius:99px;border:none;background:#cfd8e8;flex:none;transition:background .15s;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s;}
  .sw.on{background:var(--navy);} .sw.on::after{transform:translateX(18px);}
  .sheet .sh-f{display:flex;gap:10px;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line);}
  .sheet .sh-f .btn{flex:1;}
  .sheet .sh-f .btn.ghost{flex:0 0 auto;width:auto;padding-left:22px;padding-right:22px;}

  /* ---- reels feed (media-first, stays dark) ---- */
  .view.reels{padding:0;overflow:hidden;background:#0f1626;}
  .feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .feed::-webkit-scrollbar{display:none;}
  .rl{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#0f1626;overflow:hidden;color:#fff;}
  .rl .stage{position:absolute;inset:0;}
  .rl .stage img,.rl .stage video{width:100%;height:100%;object-fit:cover;}
  .rl::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 46%,rgba(0,0,0,.78) 100%);}
  .rl .playbtn{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;width:78px;height:78px;border-radius:50%;
    border:none;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:30px;
    display:flex;align-items:center;justify-content:center;padding-left:5px;}
  .rl.playing .playbtn{display:none;}
  .rl.busy .playbtn{opacity:.6;pointer-events:none;}
  .rl .busytxt{display:none;position:absolute;left:0;right:0;top:calc(44% + 54px);text-align:center;z-index:2;font-weight:600;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .rl.busy .busytxt{display:block;}
  .rail-r{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);z-index:3;display:flex;flex-direction:column;gap:18px;align-items:center;}
  .act{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .act svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 4px rgba(0,0,0,.55));}
  .act.on svg{fill:#ff5a6a;stroke:#ff5a6a;}
  .act.saved.on svg{fill:#fff;stroke:#fff;}
  .meta-b{position:absolute;left:14px;right:70px;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);z-index:3;}
  .who-r{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid rgba(255,255,255,.85);}
  .who-r b{display:block;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .who-r span{font-size:12px;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .fol{border:none;background:rgba(232,244,255,.95);color:#12314f;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;margin-left:2px;}
  .fol.off{background:rgba(255,255,255,.22);color:#fff;}
  .cap-r{font-size:14px;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .cap-r .more{background:none;border:none;color:#fff;font-weight:700;padding:0 0 0 6px;font-size:14px;}
  .shopbar{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:3;height:52px;border-radius:26px;
    background:rgba(19,44,88,.94);border:none;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:15px;font-weight:700;}
  .reel-chips{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:4;display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none;}
  .reel-chips::-webkit-scrollbar{display:none;}
  .reel-chips button{flex:none;border:none;border-radius:99px;padding:8px 16px;font-size:14.5px;font-weight:600;color:#fff;
    background:rgba(15,22,38,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-transform:capitalize;}
  .reel-chips button.on{background:rgba(255,255,255,.9);color:var(--navy-deep);}

  /* ---- floating dock ---- */
  .dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;
    align-items:center;pointer-events:none;z-index:8;}
  .dock>*{pointer-events:auto;}
  .dock-back,.dock-search{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.97);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none;}
  .dock-back{font-size:26px;line-height:1;padding:0 0 3px;}
  .dock-search{margin-left:auto;}
  .dock-search svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;}
  .dock-search.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .dock-pill{display:flex;gap:4px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:99px;padding:5px;box-shadow:var(--shadow);margin:0 auto 0 0;}
  .dock-pill button{position:relative;width:60px;height:44px;border-radius:99px;border:none;background:none;color:#8a97b0;display:flex;align-items:center;justify-content:center;}
  .dock-pill button.on{color:#fff;background:var(--navy);}
  .dock-pill svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .dock-pill svg .rc{fill:none!important;}
  .dock-pill .count{position:absolute;top:2px;right:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:16px;text-align:center;}
  .dock.dark .dock-pill,.dock.dark .dock-back,.dock.dark .dock-search{background:rgba(20,28,46,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-color:rgba(255,255,255,.12);}
  .dock.dark .dock-pill button{color:rgba(255,255,255,.75);}
  .dock.dark .dock-pill button.on{color:#fff;background:rgba(255,255,255,.2);}
  .dock.dark .dock-search.on{background:rgba(255,255,255,.25);}
  .toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--navy-deep);color:#fff;padding:12px 14px;
    border-radius:14px;font-size:14px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);
    transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;transform:none;}
</style>
</head>
<body>
<div class="app"><div class="screen">
  <div class="view" id="view"></div>
  <div class="dock" id="dock"></div>
  <div class="toast" id="toast"></div>
  <div id="sheet"></div>
</div></div>

<script>
(function(){
  "use strict";

  var STORE = "craftly_buyer_app_v2";
  var products = [];
  var loadError = null;
  var state = load();
  var route = {name:"home", params:{}};
  var history = [];
  var DEFAULT_FILTERS = {q:"", category:"", state:"", material:"", craft:"", colour:"", min:"", max:"", inStock:false, sort:"relevance"};
  var filters = Object.assign({}, DEFAULT_FILTERS);
  var sheetOpen = false;
  function resetFilters(){ filters = Object.assign({}, DEFAULT_FILTERS); }
  var sampleCode = null;
  var reelCat = "";
  var reelTimer = null;

  function load(){
    try{ var raw = localStorage.getItem(STORE); if (raw){ var s = JSON.parse(raw);
      return {lang:s.lang === "hi" ? "hi" : "en", basket:s.basket || {}, likes:s.likes || {}, saved:s.saved || {}, follows:s.follows || {}}; } }catch(e){}
    return {lang:"en", basket:{}, likes:{}, saved:{}, follows:{}};
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

  var T = {
    en:{shop:"Shop",bulk:"Bulk order",bulkOrders:"Bulk orders",basket:"Basket",search:"Search a craft, material, village…",all:"All",
      addBasket:"Add to basket",inBasket:"In basket",toMaker:"to the maker",howPriced:"How this price is built",
      about:"About this piece",checkout:"Check out",placeOrder:"Place order",empty:"Your basket is empty.",
      total:"Total",name:"Your name",phone:"Phone",address:"Address",city:"City",state:"State",pincode:"Pincode",
      orderPlaced:"Order placed",orderThanks:"Her share is recorded for her when it is delivered.",
      continueShopping:"Keep shopping",quote:"Get quote",qty:"Quantity",deadline:"Needed by",piece:"Piece",
      verifyTag:"Verify a tag",verifyTitle:"Verify a craft passport",code:"Passport code",check:"Check",trySample:"Try a sample code",
      madeBy:"Made by",hours:"Hours of work",materials:"Materials cost",chain:"How it came to exist",
      noResults:"Nothing matches that.",unavailable:"Could not reach the shop service.",
      collections:"Collections",reels:"Reels",watch:"Watch the making",shopAll:"All pieces",pieces:"pieces",makers:"makers",
      goesToMaker:"goes to the maker",tagline:"HANDMADE · TRACEABLE",heroA:"Handmade,",heroB:"with a story",caps1:"TRACEABLE MAKERS",caps2:"TIMELESS CRAFTS",caps3:"A BRIGHTER INDIA",meetMaker:"Meet the maker",meetSub:"THEIR STORIES.<br>EXTRAORDINARY CRAFTS.",explore:"Explore crafts",seeAll:"See all",saved:"Saved",makersTitle:"Meet the makers",nothingSaved:"Tap the heart on a reel to keep pieces here.",pcs:"pieces",filters:"Filters",sortRel:"Most relevant",sortLow:"Price: low to high",sortHigh:"Price: high to low",sortShare:"Fairest to the maker",fLocation:"Location (state)",fMaterial:"Material",fCraft:"Craft",fColour:"Colour",fPrice:"Price (₹)",fMin:"Min",fMax:"Max",fAvail:"Availability",fInStock:"In stock now",clearAll:"Clear all",showN:"Show {n} pieces",nResults:"{n} pieces",nOne:"1 piece"},
    hi:{shop:"दुकान",bulk:"थोक ऑर्डर",bulkOrders:"थोक ऑर्डर",basket:"टोकरी",search:"शिल्प, सामग्री या गाँव खोजें…",all:"सभी",
      addBasket:"टोकरी में जोड़ें",inBasket:"टोकरी में है",toMaker:"कारीगर को",howPriced:"यह कीमत कैसे बनी",
      about:"इस कृति के बारे में",checkout:"चेकआउट",placeOrder:"ऑर्डर करें",empty:"आपकी टोकरी खाली है।",
      total:"कुल",name:"आपका नाम",phone:"फ़ोन",address:"पता",city:"शहर",state:"राज्य",pincode:"पिनकोड",
      orderPlaced:"ऑर्डर हो गया",orderThanks:"डिलीवरी पर कारीगर का हिस्सा उसके नाम दर्ज होगा।",
      continueShopping:"खरीदारी जारी रखें",quote:"कोटेशन लें",qty:"मात्रा",deadline:"कब तक चाहिए",piece:"वस्तु",
      verifyTag:"टैग जाँचें",verifyTitle:"क्राफ्ट पासपोर्ट जाँचें",code:"पासपोर्ट कोड",check:"जाँचें",trySample:"नमूना कोड आज़माएँ",
      madeBy:"बनाने वाले",hours:"काम के घंटे",materials:"सामग्री की लागत",chain:"यह कैसे बना",
      noResults:"कुछ नहीं मिला।",unavailable:"दुकान की सेवा से संपर्क नहीं हो सका।",
      collections:"संग्रह",reels:"रील",watch:"बनते हुए देखें",shopAll:"सभी वस्तुएँ",pieces:"वस्तुएँ",makers:"कारीगर",
      goesToMaker:"कारीगर को मिलता है",tagline:"हस्तनिर्मित · प्रमाणित",heroA:"हस्तनिर्मित,",heroB:"हर कृति एक कहानी",caps1:"पहचाने जाने वाले कारीगर",caps2:"कालजयी शिल्प",caps3:"एक उज्ज्वल भारत",meetMaker:"कारीगरों से मिलें",meetSub:"उनकी कहानियाँ।<br>अनोखे शिल्प।",explore:"शिल्प देखें",seeAll:"सभी देखें",saved:"सहेजे गए",makersTitle:"कारीगरों से मिलें",nothingSaved:"रील पर दिल दबाएँ, यहाँ सहेजे जाएँगे।",pcs:"वस्तुएँ",filters:"फ़िल्टर",sortRel:"सबसे प्रासंगिक",sortLow:"कीमत: कम से ज़्यादा",sortHigh:"कीमत: ज़्यादा से कम",sortShare:"कारीगर को सबसे ज़्यादा",fLocation:"स्थान (राज्य)",fMaterial:"सामग्री",fCraft:"शिल्प",fColour:"रंग",fPrice:"कीमत (₹)",fMin:"न्यूनतम",fMax:"अधिकतम",fAvail:"उपलब्धता",fInStock:"अभी स्टॉक में",clearAll:"सब हटाएँ",showN:"{n} वस्तुएँ दिखाएँ",nResults:"{n} वस्तुएँ",nOne:"1 वस्तु"}
  };
  // On Hindi screens every label carries a short English gloss in brackets.
var SHORT_EN = {search:"Search", howPriced:"How it's priced", orderThanks:"Her share, on delivery",
  chain:"Its journey", unavailable:"Shop unavailable", nothingSaved:"Nothing saved yet"};
function t(k){
  var v = (T[state.lang] && T[state.lang][k]) || T.en[k] || k;
  if (state.lang === "hi" && T.hi[k] && T.en[k] && T.hi[k] !== T.en[k]) v += " (" + (SHORT_EN[k] || T.en[k]) + ")";
  return v;
}

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  // Indian digit grouping (12,34,567), same as the site's money.py.
  function rupees(n){
    if (n == null) return "—";
    var s = String(Math.round(n)), last3 = s.slice(-3), rest = s.slice(0, -3);
    if (rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + ",";
    return "₹" + rest + last3;
  }
  function title(p){ var l = p.listing; return (state.lang === "hi" && l.title_hi) || l.title_en || l.title_hi || "Handmade piece"; }
  function desc(p){ var l = p.listing; return (state.lang === "hi" && l.description_hi) || l.description_en || l.description_hi || ""; }
  // Catalogue photos keep their filenames when they're replaced, so version the URL
  // or a browser will keep showing the old file.
  var PIC_V = "3";
  function pic(u){ return u ? u + (u.indexOf("?") < 0 ? "?v=" + PIC_V : "") : u; }
  function byId(id){ return products.find(function(p){ return p.listing.listing_id === id; }); }
  function basketCount(){ return Object.keys(state.basket).reduce(function(n,k){ return n + state.basket[k]; }, 0); }

  var toastTimer = null;
  function toast(msg){ var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600); }

  function go(name, params){ history.push(route); route = {name:name, params:params || {}}; render(); }
  function goTab(name){ history = []; route = {name:name, params:{}}; render(); }
  function back(){ if (history.length){ route = history.pop(); render(); } else goTab("home"); }

  function api(path){
    return fetch(path).then(function(r){
      return r.json().then(function(d){ if (!r.ok) throw new Error(d.detail || ("Request failed (" + r.status + ")")); return d; });
    });
  }

  /* ---------- chrome ---------- */
  var ICON = {
    home:'<svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>',
    reels:'<svg viewBox="0 0 24 24"><rect class="rc" x="4" y="4" width="16" height="16" rx="4.5"/><path d="m10.2 8.9 4.6 3.1-4.6 3.1z" style="fill:currentColor;stroke:none"/></svg>',
    search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
    bag:'<svg viewBox="0 0 24 24"><path d="M6 8.5h12l-1 11.5H7z"/><path d="M9 8.5V7.5a3 3 0 0 1 6 0v1"/></svg>',
    heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    sliders:'<svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>',
    leaf:'<svg viewBox="0 0 20 24"><path d="M10 22c0-6 1-11 6-16 .6 6-1.5 11-6 16z" fill="#ee7b30"/><path d="M10 17c0-4-1-7-6-9-.6 4 1.6 7.6 6 9z" fill="#f7a05f"/></svg>',
    mark:'<svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg>',
    share:'<svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v6h14v-6"/></svg>'
  };
  function dock(){
    var r = route.name;
    var cur = r === "home" ? "home" : r === "reels" ? "reels" : (r === "shop" || r === "product") ? "search"
      : (r === "basket" || r === "checkout" || r === "placed") ? "bag" : "";
    var n = basketCount(), el = document.getElementById("dock");
    el.className = "dock" + (r === "reels" ? " dark" : "");
    el.style.display = r === "home" ? "none" : "flex";
    el.innerHTML =
      (history.length ? '<button class="dock-back" id="dockBack" aria-label="Back">‹</button>' : "") +
      '<nav class="dock-pill">' +
      '<button data-tab="home" class="' + (cur === "home" ? "on" : "") + '" aria-label="Home">' + ICON.home + '</button>' +
      '<button data-tab="reels" class="' + (cur === "reels" ? "on" : "") + '" aria-label="Reels">' + ICON.reels + '</button>' +
      '<button data-tab="basket" class="' + (cur === "bag" ? "on" : "") + '" aria-label="Basket">' + ICON.bag +
        (n ? '<span class="count">' + n + '</span>' : "") + '</button></nav>' +
      '<button class="dock-search' + (cur === "search" ? " on" : "") + '" data-tab="shop" aria-label="Search">' + ICON.search + '</button>';
    var db = document.getElementById("dockBack"); if (db) db.onclick = back;
    Array.prototype.forEach.call(el.querySelectorAll("[data-tab]"), function(b){
      b.onclick = function(){ var to = b.getAttribute("data-tab"); if (to === "shop"){ resetFilters(); } if (to === "reels"){ reelCat = ""; } goTab(to); };
    });
  }
  function head(text){ return '<h1 class="h1">' + esc(text) + '</h1>'; }

  function render(){
    document.body.classList.toggle("lang-hi", state.lang === "hi");
    var view = document.getElementById("view");
    var fn = SCREENS[route.name];
    try{
      clearInterval(reelTimer); sheetOpen = false; drawSheet();
      view.className = "view" + (route.name === "home" ? " home" : route.name === "reels" ? " reels" : "");
      view.innerHTML = fn(route.params);
      view.scrollTop = 0;
      dock();
      BIND[route.name] && BIND[route.name](route.params);
    }catch(err){
      view.innerHTML = '<p class="empty">Something went wrong.<br><small>' + esc(err.message) + '</small></p>';
      if (window.console) console.error(err);
    }
  }

  var SCREENS = {}, BIND = {};

  /* ---------- home (storefront) ---------- */
  function categories(){
    var seen = {}, out = [];
    products.forEach(function(p){ var c = p.listing.category; if (c && !seen[c]){ seen[c] = p; out.push({name:c, product:p}); } });
    return out;
  }
  function topbar(){
    var n = basketCount();
    return '<div class="hdr"><div class="wm">Craftly' + ICON.leaf + '</div><div class="ico">' +
      '<button class="ib lang" id="langBtn" aria-label="Language">' + (state.lang === "en" ? "अ" : "A") + '</button>' +
      '<button class="ib" data-tab-go="shop" aria-label="Search">' + ICON.search + '</button>' +
      '<button class="ib" data-go="saved" aria-label="Saved">' + ICON.heart + '</button>' +
      '<button class="ib" data-tab-go="basket" aria-label="Basket">' + ICON.bag + (n ? '<span class="count">' + n + '</span>' : "") + '</button></div></div>';
  }
  SCREENS.home = function(){
    var withImg = products.filter(function(p){ return pic(p.image_url); });
    var tiles = categories().map(function(c){
      return '<button class="tile" data-cat="' + esc(c.name) + '"><div class="im">' +
        (pic(c.product.image_url) ? '<img loading="lazy" src="' + esc(pic(c.product.image_url)) + '" alt="">' : "") + '</div>' +
        '<div class="lb">' + esc(c.name) + '</div></button>';
    }).join("");
    var reels = withImg.slice(0, 8).map(function(p){
      return '<button class="reel" data-reel="' + esc(p.listing.listing_id) + '">' +
        '<img loading="lazy" src="' + esc(pic(p.image_url)) + '" alt=""><span class="play">▶</span>' +
        '<span class="cap">' + esc(title(p)) + '</span></button>';
    }).join("");
    if (loadError) return topbar() + '<div class="pad"><div class="note err">' + esc(t("unavailable")) + '<br><small>' + esc(loadError) + '</small></div></div>';
    return topbar() +
      '<div class="hero"><div class="txt"><h2>' + t("heroA") + '<em>' + t("heroB") + '</em></h2><div class="rule"></div>' +
        '<div class="caps">' + t("caps1") + '<br>' + t("caps2") + '<br>' + t("caps3") + '</div></div></div>' +
      '<button class="maker" data-go="makers"><div class="ph"></div><div class="tx"><h3>' + t("meetMaker") + '</h3>' +
        '<div class="sub">' + t("meetSub") + '</div></div><span class="chev">›</span></button>' +
      '<div class="tiles">' + tiles + '</div>' +
      '<button class="cta" data-tab-go="shop">' + t("explore") + ' <span>→</span></button>' +
      '<div class="quick"><button data-go="bulk">📦 ' + t("bulkOrders") + '</button><button data-go="scan">🔍 ' + t("verifyTag") + '</button></div>' +
      '<h2 class="sec">' + t("reels") + '<button data-tab-go="reels">' + t("seeAll") + ' ›</button></h2><div class="rail">' + reels + '</div>' +
      '<h2 class="sec">' + t("shopAll") + '</h2><div class="pad"><div class="grid" id="grid">' + gridHtml(products) + '</div></div>' +
      '<div class="stub">Sample catalogue: the makers and their stories are illustrative. Photos: Wikimedia Commons contributors — see seed/media/CREDITS.md</div>';
  };
  function bindTop(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(b){ b.onclick = function(){ go(b.getAttribute("data-go")); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-tab-go]"), function(b){
      b.onclick = function(){ var to = b.getAttribute("data-tab-go"); if (to === "shop") resetFilters(); if (to === "reels") reelCat = ""; goTab(to); };
    });
    var l = document.getElementById("langBtn"); if (l) l.onclick = function(){ state.lang = state.lang === "en" ? "hi" : "en"; save(); render(); };
  }
  BIND.home = function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function(b){
      b.onclick = function(){ resetFilters(); filters.category = b.getAttribute("data-cat"); go("shop"); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-reel]"), function(b){ b.onclick = function(){ reelCat = ""; go("reels", {start:b.getAttribute("data-reel")}); }; });
    bindTop(); bindGrid();
  };

  /* ---------- makers ---------- */
  SCREENS.makers = function(){
    var by = {};
    products.forEach(function(p){ var m = by[p.artisan_id] || (by[p.artisan_id] = {name:p.artisan_name, place:p.place, n:0, img:pic(p.image_url), craft:p.listing.craft_type}); m.n++; });
    var rows = Object.keys(by).map(function(id){ var m = by[id];
      return '<button class="mk" data-maker="' + esc(m.name) + '"><img src="' + esc(m.img || "") + '" alt=""><div><b>' + esc(m.name) + '</b>' +
        '<span>' + esc([m.place, m.craft].filter(Boolean).join(" · ")) + ' · ' + m.n + ' ' + (m.n === 1 && state.lang === "en" ? "piece" : t("pcs")) + '</span></div><span class="chev">›</span></button>'; }).join("");
    return head(t("makersTitle")) + (rows || '<p class="empty">' + t("noResults") + '</p>');
  };
  BIND.makers = function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-maker]"), function(b){
      b.onclick = function(){ resetFilters(); filters.q = b.getAttribute("data-maker"); go("shop"); };
    });
  };

  /* ---------- saved ---------- */
  SCREENS.saved = function(){
    var list = products.filter(function(p){ return state.saved[p.listing.listing_id] || state.likes[p.listing.listing_id]; });
    return head(t("saved")) + (list.length ? '<div class="grid" id="grid">' + gridHtml(list) + '</div>' : '<p class="empty">' + t("nothingSaved") + '</p>');
  };
  BIND.saved = function(){ bindGrid(); };

  /* ---------- reels (vertical feed) ---------- */
  function reelList(){
    return products.filter(function(p){ return pic(p.image_url) && (!reelCat || p.listing.category === reelCat); });
  }
  function initials(n){ return String(n || "?").split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0); }).join("").toUpperCase(); }
  var AVCOL = ["#b8542e","#2b4159","#4f6e4a","#7a3820","#6b4c8a","#a06a1a"];
  function avcol(n){ var h = 0; String(n).split("").forEach(function(c){ h = (h * 31 + c.charCodeAt(0)) % 997; }); return AVCOL[h % AVCOL.length]; }
  SCREENS.reels = function(){
    var list = reelList();
    var chips = '<button class="' + (!reelCat ? "on" : "") + '" data-rc="">' + t("all") + '</button>' +
      categories().map(function(c){ return '<button class="' + (reelCat === c.name ? "on" : "") + '" data-rc="' + esc(c.name) + '">' + esc(c.name) + '</button>'; }).join("");
    var items = list.map(function(p){
      var id = p.listing.listing_id;

  function playReel(id, sec){
    var stage = sec.querySelector(".stage");
    sec.classList.add("busy");
    // The server builds a reel on first request (ffmpeg can take minutes on a
    // slow machine) and reuses it after, so don't hold the viewer hostage:
    // give it 12s, then say it's still rendering — the next tap is instant.
    var ctl = window.AbortController ? new AbortController() : null;
    var slow = setTimeout(function(){ if (ctl) ctl.abort(); }, 12000);
    // The reel in the language the buyer is reading: Hindi captions and a Hindi voiceover.
    fetch("/reel/" + encodeURIComponent(id) + "?lang=" + state.lang, ctl ? {signal:ctl.signal} : undefined).then(function(r){ clearTimeout(slow); return r.text(); }).then(function(html){
      var doc = new DOMParser().parseFromString(html, "text/html");
      var v = doc.querySelector("video"), src = v && v.getAttribute("src");
      if (src){
        stage.innerHTML = '<video src="' + esc(src) + '" autoplay' + (state.sound ? "" : " muted") + ' loop playsinline></video>';
        var vid = stage.firstChild;
        vid.onclick = function(){ this.paused ? this.play() : this.pause(); };
        // Reels carry a voiceover. A browser may refuse sound before the viewer has
        // interacted with the page; then play muted rather than not at all.
        if (vid.play) vid.play().catch(function(){ vid.muted = true; vid.play().catch(function(){}); });
        sec.classList.add("playing"); return;
      }
      var frames = Array.prototype.map.call(doc.querySelectorAll("img"), function(i){ return i.getAttribute("src"); })
        .filter(function(u){ return u && /\/reels\//.test(u); });
      if (frames.length){
        var i = 0; stage.innerHTML = '<img src="' + esc(frames[0]) + '" alt="">';
        clearInterval(reelTimer);
        reelTimer = setInterval(function(){ i = (i + 1) % frames.length; stage.firstChild.src = frames[i]; }, 1800);
        sec.classList.add("playing"); toast("Storyboard preview — install ffmpeg for video");
        return;
      }
      window.open("/reel/" + encodeURIComponent(id) + "?lang=" + state.lang, "_blank");
    }).catch(function(e){
      if (e && e.name === "AbortError") toast("Still rendering this reel — tap play again in a minute");
      else window.open("/reel/" + encodeURIComponent(id) + "?lang=" + state.lang, "_blank");
    }).then(function(){ clearTimeout(slow); sec.classList.remove("busy"); });
  }

    return Object.keys(m).sort().map(function(k){ return {v:k, n:m[k]}; });

  function visible(){
    var q = filters.q.trim().toLowerCase();
    var min = filters.min === "" ? null : Number(filters.min), max = filters.max === "" ? null : Number(filters.max);
    var list = products.filter(function(p){
      var l = p.listing, price = p.price.price_inr;
      if (filters.category && l.category !== filters.category) return false;
      if (filters.state && stateOf(p) !== filters.state) return false;
      if (filters.material && l.material !== filters.material) return false;
      if (filters.craft && l.craft_type !== filters.craft) return false;
      if (filters.colour && (l.colours || []).indexOf(filters.colour) === -1) return false;
      if (min != null && price < min) return false;
      if (max != null && price > max) return false;
      if (filters.inStock && !(p.inventory.in_stock > 0)) return false;
      if (!q) return true;
      return [l.title_en, l.title_hi, l.category, l.craft_type, l.material, (l.colours || []).join(" "), p.artisan_name, p.place]
        .join(" ").toLowerCase().indexOf(q) !== -1;
    });
    if (filters.sort === "price_low") list.sort(function(a, b){ return a.price.price_inr - b.price.price_inr; });
    else if (filters.sort === "price_high") list.sort(function(a, b){ return b.price.price_inr - a.price.price_inr; });

  BIND.checkout = function(){
    var form = document.getElementById("coForm");
    form.onsubmit = function(e){
      e.preventDefault();
      var btn = document.getElementById("placeBtn"), err = document.getElementById("coErr");
      btn.disabled = true; err.innerHTML = "";
      var ls = lines(), fd = new FormData(form), fields = {};
      fd.forEach(function(v,k){ fields[k] = v; });
      // The site's basket is a signed cookie, so mirror this basket into it
      // (zero any leftovers first), then place the order through the same
      // /checkout the website uses — no separate order path to keep in sync.
      var seq = Promise.resolve();

      ls.forEach(function(x){ seq = seq.then(function(){ return post("/cart/add", {listing_id:x.p.listing.listing_id, quantity:x.qty, then:"/cart"}); }); });
      seq.then(function(){ return post("/checkout", fields); }).then(function(r){
        var m = /\/order\/([^/?#]+)/.exec(r.url);
        if (!r.ok || !m) throw new Error("The shop could not place this order — an item may no longer be for sale.");
        state.basket = {}; save();
        history = []; route = {name:"placed", params:{id:decodeURIComponent(m[1])}}; render();
      }).catch(function(e2){ btn.disabled = false; err.innerHTML = '<div class="note err">' + esc(e2.message) + '</div>'; });
    };
  };
  SCREENS.placed = function(params){
    return head(t("orderPlaced")) + '<div class="note ok"><b>' + esc(params.id) + '</b><br><span class="muted">' +
      t("orderThanks") + '</span></div><button class="btn ghost" id="moreBtn">' + t("continueShopping") + '</button>';
  };
  BIND.placed = function(){ document.getElementById("moreBtn").onclick = function(){ goTab("home"); }; };

  /* ---------- bulk ---------- */
  SCREENS.bulk = function(){
    var opts = products.filter(function(p){ return p.can_buy; }).map(function(p){
      return '<option value="' + esc(p.listing.listing_id) + '">' + esc(title(p)) + '</option>'; }).join("");
    return head(t("bulkOrders")) + '<p class="muted" style="margin-top:0">Bulk orders are split across the maker\'s cluster. Discounts come out of the margin, never the wage floor.</p>' +
      '<form id="bulkForm"><label class="f">' + t("piece") + '<select name="listing_id">' + opts + '</select></label>' +
      '<label class="f">' + t("qty") + '<input name="quantity" type="number" min="1" value="100" required></label>' +
      '<label class="f">' + t("deadline") + '<input name="deadline" type="date"></label>' +
      '<button class="btn" type="submit">' + t("quote") + '</button></form><div id="bulkOut"></div>';
  };
  BIND.bulk = function(){
    var form = document.getElementById("bulkForm"), out = document.getElementById("bulkOut");
    form.onsubmit = function(e){
      e.preventDefault(); out.innerHTML = '<p class="muted">Quoting…</p>';
      var q = new URLSearchParams(); new FormData(form).forEach(function(v,k){ if (v) q.set(k, v); });
      api("/api/bulk/quote?" + q.toString()).then(function(d){
        var h = "";
        if (d.errors && d.errors.length) h += '<div class="note err">' + d.errors.map(esc).join("<br>") + '</div>';
        if (!d.can_order){
          if (d.max_by_deadline != null) h += '<div class="note">They can commit <b>' + d.max_by_deadline + '</b> units by that date.</div>';
          if (d.days_needed != null) h += '<div class="note">All ' + d.quantity + ' would need about <b>' + d.days_needed + ' days</b>.</div>';
        } else {
          h += '<div class="box"><h3>' + rupees(d.unit_price_inr) + ' each</h3><div class="muted">Retail ' + rupees(d.retail_unit_price_inr) +
            ' · subtotal <b>' + rupees(d.subtotal_inr) + '</b><br>To the makers: ' + rupees(d.artisan_total_inr) + '</div></div>';
        }
        var al = (d.split && d.split.allocations) || [];
        if (al.length) h += '<div class="box"><h3>Split across the cluster</h3><ul>' + al.map(function(a){
          return "<li>" + esc(a.artisan_name) + (a.village ? " (" + esc(a.village) + ")" : "") + " — " + a.quantity + " units" +
            (a.lead_time_days ? ", " + a.lead_time_days + " days" : "") + "</li>"; }).join("") + '</ul></div>';
        (d.warnings || []).forEach(function(w){ h += '<div class="note">' + esc(w) + '</div>'; });
        out.innerHTML = h;
      }).catch(function(e2){ out.innerHTML = '<div class="note err">' + esc(e2.message) + '</div>'; });
    };
  };

  /* ---------- verify passport ---------- */
  SCREENS.scan = function(){
    return head(t("verifyTitle")) + '<form id="scanForm"><label class="f">' + t("code") +
      '<input name="code" placeholder="CR-XXXX-XXXX or lst_…" autocapitalize="characters" required></label>' +
      '<button class="btn" type="submit">' + t("check") + '</button></form>' +
      (sampleCode ? '<button class="btn ghost small" id="sampleBtn" style="margin-top:12px">' + t("trySample") + '</button>' : "") +
      '<div id="scanOut"></div>';
  };
  BIND.scan = function(){
    var form = document.getElementById("scanForm"), out = document.getElementById("scanOut");
    function run(code){
      out.innerHTML = '<p class="muted">Checking…</p>';
      // A passport code (CR-…) or the listing id an artisan sees in her Studio (lst_…).
      var c = code.trim();
      var lookup = /^lst_/i.test(c)
        ? api("/api/products/" + encodeURIComponent(c.toLowerCase())).then(function(p){
            if (!p.passport_code) throw new Error("This listing has no passport yet.");
            return api("/api/passports/" + encodeURIComponent(p.passport_code)); })
        : api("/api/passports/" + encodeURIComponent(c));
      lookup.then(function(d){
        var a = d.artisan || {};
        out.innerHTML = '<div class="note ok"><b>✓ Verified</b> · ' + esc(d.verification_code) + '</div>' +
          '<div class="box"><h3>' + t("madeBy") + " " + esc(a.name || "") + '</h3><div class="muted">' +
          esc([d.made_at || a.village, a.district, a.state].join(", ").split(/,\s*/).filter(function(x, i, all){ return x && all.indexOf(x) === i; }).join(", ")) + '</div>' +
          '<div style="margin-top:8px;font-size:14.5px">' + esc([d.craft_type, d.material].filter(Boolean).join(" · ")) + '</div>' +
          (d.hours_worked != null ? '<div class="muted">' + t("hours") + ": " + d.hours_worked + '</div>' : "") +
          (d.material_cost_inr != null ? '<div class="muted">' + t("materials") + ": " + rupees(d.material_cost_inr) + '</div>' : "") + '</div>' +
          ((d.chain || []).length ? '<div class="box"><h3>' + t("chain") + '</h3><ol class="steps">' +
            d.chain.map(function(s){ return "<li><b>" + esc(s.label) + "</b>" + esc(s.detail || "") + "</li>"; }).join("") + '</ol></div>' : "");
      }).catch(function(){ out.innerHTML = '<div class="note err">We cannot verify this code. Check it and try again.</div>'; });
    }
    form.onsubmit = function(e){ e.preventDefault(); run(new FormData(form).get("code")); };
    var s = document.getElementById("sampleBtn");
    if (s) s.onclick = function(){ form.elements.code.value = sampleCode; run(sampleCode); };
  };

  /* ---------- keep the catalogue current ---------- */
  // The list is fetched once at boot and filtered here, so a piece an artisan
  // publishes after the page opened would never appear. Re-fetch when the tab
  // comes back into view and every 30s; redraw only when something changed,
  // and never under the buyer's typing on the Shop screen.
  function refreshProducts(){
    if (document.hidden) return;
    api("/api/products?per_page=100").then(function(d){
      var before = products.map(function(p){ return p.listing.listing_id + p.price.price_inr + p.can_buy; }).join();
      var after = d.products.map(function(p){ return p.listing.listing_id + p.price.price_inr + p.can_buy; }).join();
      if (before === after) return;
      products = d.products; loadError = null;
      if (route.name === "shop" && document.getElementById("grid")) refreshList();
      else if (route.name !== "checkout" && route.name !== "bulk" && route.name !== "scan") render();
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) refreshProducts(); });
  setInterval(refreshProducts, 30000);

  /* ---------- boot ---------- */
  api("/api/products?per_page=100").then(function(d){ products = d.products; })
    .catch(function(e){ loadError = e.message; })
    .then(function(){
      // Deep links for demos: /#/reels, /#/shop, /#/makers, /#/product/<id>, /#/reels/<id>
      var m = /^#\/(\w+)(?:\/([^?]+))?/.exec(location.hash);
      if (m && SCREENS[m[1]] && m[1] !== "placed"){
        route = {name:m[1], params: m[1] === "product" ? {id:m[2]} : m[1] === "reels" && m[2] ? {start:m[2]} : {}};
      }
      render();
      if (/filters/.test(location.hash) && route.name === "shop"){ sheetOpen = true; drawSheet(); }
      var first = products[0];
      if (first) api("/api/products/" + encodeURIComponent(first.listing.listing_id)).then(function(d){
        if (d.passport_code){ sampleCode = d.passport_code; if (route.name === "scan") render(); } }).catch(function(){});
    });
})();
</script>
</body>
</html>
