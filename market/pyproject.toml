[project]
name = "craftly-market"
version = "0.1.0"
description = "Craftly buyer surfaces — storefront, B2B portal, QR passport landing, reel generation (slice C1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "qrcode[pil]>=7.4",
    "pillow>=10.4",
    "python-dotenv>=1.0",
    "gtts>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
