<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craftly C2 Console</title>
<style>
  :root { --bg:#faf6f0; --card:#fff; --ink:#2b2118; --mute:#7a6a58; --line:#e6dccd; --accent:#b4531f; --ok:#2f7d4f; --warn:#a86a00; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding:20px 16px 8px; max-width:960px; margin:0 auto; }
  h1 { margin:0; font-size:22px; }
  .sub { color:var(--mute); margin:2px 0 0; }
  main { max-width:960px; margin:0 auto; padding:8px 16px 48px; display:grid; gap:14px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  h2 { margin:0 0 8px; font-size:16px; }
  h2 span { color:var(--accent); margin-right:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, button { font:inherit; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  .tag.sim { color:var(--warn); border-color:var(--warn); }
  .tag.ok { color:var(--ok); border-color:var(--ok); }
  .out { margin-top:10px; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:2px 10px; margin:6px 0; }
  .kv b { color:var(--mute); font-weight:500; }
  .call { border-left:3px solid var(--accent); padding:4px 10px; margin:8px 0; background:#fdf9f3; }
  .call small { color:var(--mute); display:block; }
  .warn { color:var(--warn); }
  pre { background:#2b2118; color:#f3eadc; padding:10px; border-radius:8px; overflow:auto; max-height:260px; font-size:12px; }
  details summary { cursor:pointer; color:var(--mute); }
  @media (max-width:560px) { .kv { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Craftly C2 &mdash; integrations console</h1>
  <p class="sub">Marketplace push, courier booking, artisan calls, demand alert. <span class="tag sim">all simulated</span> <span id="src" class="tag"></span></p>
</header>
<main>
  <section>
    <h2><span>1</span>Push a listing to a marketplace</h2>
    <div class="row">
      <select id="listing"></select>
      <select id="channel"><option>amazon</option><option>flipkart</option><option>ebay</option></select>
      <button id="btnPush">Push listing</button>
    </div>
    <div id="outPush" class="out"></div>
  </section>

  <section>
    <h2><span>2</span>Confirm an order &rarr; courier + calls</h2>
    <div class="row">
      <select id="order"></select>
      <button id="btnConfirm">Book courier &amp; call artisans</button>
      <button id="btnDeliver" class="ghost">Simulate delivery &amp; payout call</button>
    </div>
    <div id="outOrder" class="out"></div>
  </section>

  <section>
    <h2><span>3</span>Weekly demand alert</h2>
    <div class="row"><button id="btnDemand">Build alert</button></div>
    <div id="outDemand" class="out"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const inr = (n) => n == null ? "-" : "₹" + Number(n).toLocaleString("en-IN");
const json = (o) => `<details><summary>raw JSON</summary><pre>${esc(JSON.stringify(o, null, 2))}</pre></details>`;
const kv = (pairs) => `<div class="kv">${pairs.map(([k, v]) => `<b>${esc(k)}</b><span>${v}</span>`).join("")}</div>`;

async function api(method, url) {
  const r = await fetch(url, { method });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

const calls = (list) => list.map((c) => `
  <div class="call"><small>${esc(c.event)} &middot; ${esc(c.artisan_name)} &middot; ${esc(c.to_phone)} &middot; ${esc(c.language)} &middot; ${c.duration_sec}s &middot; ${esc(c.outcome)}</small>
  ${esc(c.script)}${c.language !== "en" ? `<small>EN: ${esc(c.script_en)}</small>` : ""}</div>`).join("");

async function init() {
  const [health, listings, orders] = await Promise.all([api("GET", "/api/health"), api("GET", "/api/listings"), api("GET", "/api/orders")]);
  $("src").textContent = "C1 via " + health.c1_source;
  $("src").className = "tag " + (health.c1_source === "seed_fallback" ? "sim" : "ok");
  $("listing").innerHTML = listings.map((l) => `<option value="${esc(l.listing_id)}">${esc(l.title)}</option>`).join("");
  $("order").innerHTML = orders.orders.map((o) => `<option value="${esc(o.order_id)}">${esc(o.order_id)} — ${esc(o.buyer)}, ${o.units} unit(s), ${inr(o.total_inr)}</option>`).join("")
    || `<option value="">no orders</option>`;
  if (orders.simulated) $("outOrder").innerHTML = `<p class="tag sim">No orders in market/orders.jsonl yet &mdash; showing sample orders built from C1's catalogue.</p>`;
}

$("btnPush").onclick = async () => {
  $("outPush").textContent = "...";
  try {
    const p = await api("POST", `/api/channels/${$("channel").value}/push/${$("listing").value}`);
    const sent = p.response.status !== "NOT_SENT";
    const s = p.response.settlement_preview;
    $("outPush").innerHTML = kv([
      ["Result", `<span class="tag ${sent ? "ok" : "sim"}">${esc(p.response.status)}</span> <span class="tag sim">simulated</span>`],
      ["Marketplace id", esc(p.response.asin || p.response.fsn || p.response.listingId || "-")],
      ["Price source", esc(p.price_source)],
      ...(s ? [["Buyer pays", inr(s.buyer_pays_inr)], ["Channel fee", inr(s.channel_fee_inr)], ["Artisan receives", `<b style="color:var(--ok)">${inr(s.artisan_receives_inr)}</b>`]] : []),
    ]) + p.warnings.map((w) => `<p class="warn">&#9888; ${esc(w)}</p>`).join("") + json(p);
  } catch (e) { $("outPush").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
};

$("btnConfirm").onclick = async () => {
  if (!$("order").value) return;
  $("outOrder").textContent = "...";
  try {
    const r = await api("POST", `/api/orders/${$("order").value}/confirm`);
    const s = r.shipment;
    $("outOrder").innerHTML = kv([
      ["Courier", `${esc(s.courier)} (${esc(s.service)}) <span class="tag sim">simulated</span>`],
      ["Master waybill", esc(s.master_waybill)],
      ["Pickup", `${esc(s.pickup_date)} ${esc(s.pickup_window)}`],
      ["Pickups", s.pickups.map((p) => `${esc(p.artisan_name)} (${esc(p.village)}) &times;${p.quantity} &middot; ${esc(p.waybill)}`).join("<br>")],
      ["Payouts", r.payouts.map((p) => `${esc(p.artisan_name)}: ${inr(p.amount_inr)}`).join("<br>")],
      ["Deliver to", esc(s.deliver_to)],
      ["Est. delivery", esc(s.est_delivery)],
    ]) + r.language_gaps.map((g) => `<p class="warn">&#9888; ${esc(g)}</p>`).join("") + calls(r.calls) + json(r);
  } catch (e) { $("outOrder").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
};

$("btnDeliver").onclick = async () => {
  if (!$("order").value) return;
  try {
    const r = await api("POST", `/api/orders/${$("order").value}/deliver`);
    $("outOrder").innerHTML += `<p><span class="tag ok">delivered</span> <span class="tag sim">simulated</span></p>` + calls(r.calls);
  } catch (e) { $("outOrder").innerHTML += `<p class="warn">${esc(e.message)}</p>`; }
};

$("btnDemand").onclick = async () => {
  $("outDemand").textContent = "...";
  try {
    const a = await api("GET", "/api/demand-alert");
    $("outDemand").innerHTML = `<p>${esc(a.message_en)}</p><p>${esc(a.message_hi)}</p>
      <p><span class="tag ${a.simulated ? "sim" : "ok"}">${esc(a.orders_source)}</span> <span class="tag">${a.orders_counted} order(s)</span></p>`
      + (a.items.length ? `<table style="width:100%;border-collapse:collapse">${a.items.map((i) =>
        `<tr style="border-top:1px solid var(--line)"><td style="padding:4px 0">${esc(i.title)}<br><small style="color:var(--mute)">${esc(i.artisan_name)}</small></td><td>${i.units_ordered} sold</td><td>${esc(i.action)}</td></tr>`).join("")}</table>` : "") + json(a);
  } catch (e) { $("outDemand").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
};

init().catch((e) => { $("src").textContent = "error: " + e.message; });
</script>
</body>
</html>
